name: Run Daily Stock Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install firebase-admin pandas yfinance

      # 👉 YE NAYA STEP YAHAN JODNA HAI:
      - name: Create Firebase Credentials File
        run: |
          echo '${{ secrets.FIREBASE_CREDENTIALS }}' > firebase_credentials.json

      - name: Run python scanner.py
        run: |
          python scanner.py
          
