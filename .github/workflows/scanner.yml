name: Run Daily Stock Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install firebase-admin pandas yfinance

      - name: Run python scanner.py
        run: |
          python scanner.py
