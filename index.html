<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradePulse - Stock Scanner</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        h1 { text-align: center; color: #38bdf8; }
        .card { background: #1e293b; padding: 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .stock-header { display: flex; justify-content: space-between; align-items: center; }
        .symbol { font-size: 20px; font-weight: bold; color: #34d399; }
        .price { font-size: 18px; font-weight: bold; }
        .details { margin-top: 10px; font-size: 14px; color: #94a3b8; }
        .badge { background: #0284c7; padding: 4px 8px; border-radius: 4px; font-size: 12px; color: white; }
        .loading { text-align: center; color: #94a3b8; margin-top: 40px; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TradePulse Stock Scanner</h1>
        <p style="text-align: center; color: #94a3b8;">Smart Money Accumulation & Breakout Engine</p>
        
        <div id="stock-container">
            <div class="loading">Loading live scanned stocks from Firebase...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            projectId: "karigarhub-4be11",
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadStocks() {
            const container = document.getElementById('stock-container');
            try {
                const querySnapshot = await getDocs(collection(db, "daily_picks"));
                if (querySnapshot.empty) {
                    container.innerHTML = '<div class="loading">No stocks found in database yet. Run the scanner!</div>';
                    return;
                }

                let html = '';
                querySnapshot.forEach((doc) => {
                    const stock = doc.data();
                    html += `
                        <div class="card">
                            <div class="stock-header">
                                <div>
                                    <span class="symbol">${stock.symbol}</span> <span class="badge">${stock.category}</span>
                                </div>
                                <div class="price">${stock.price} <span style="color: #34d399; font-size: 14px;">(${stock.change})</span></div>
                            </div>
                            <div class="details">
                                <p><strong>Consolidation:</strong> ${stock.consolidation_range} | <strong>Volume:</strong> ${stock.volume_spike}</p>
                                <p><strong>Why Selected:</strong> ${stock.why_selected}</p>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                console.error("Error fetching stocks:", error);
                container.innerHTML = '<div class="loading" style="color: #f87171;">Error loading data from Firebase.</div>';
            }
        }

        loadStocks();
    </script>
</body>
</html>
