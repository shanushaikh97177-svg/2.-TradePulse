<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradePulse Pro | Institutional Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen">

    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur sticky top-0 z-50 px-4 py-3 flex justify-between items-center">
        <div>
            <h1 class="text-base font-bold tracking-wider text-blue-400">TRADEPULSE <span class="text-xs bg-blue-950 text-blue-300 px-2 py-0.5 rounded border border-blue-800">INSTITUTIONAL TERMINAL</span></h1>
            <p class="text-xs text-gray-400">Smart Money & Volume Analytics Engine</p>
        </div>
        <div id="last-updated" class="text-xs text-gray-400">Syncing...</div>
    </header>

    <main class="max-w-7xl mx-auto p-4">
        <!-- Dynamic Category Boxes Container -->
        <div id="category-boxes" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            <!-- Yeh boxes Firebase data ke hisab se apne aap generate honge -->
        </div>

        <!-- Stocks Container -->
        <div id="stocks-container" class="space-y-3">
            <div class="text-center py-10 text-gray-500">Loading terminal analytics...</div>
        </div>
    </main>

    <!-- Stock Details Modal -->
    <div id="stock-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-lg w-full p-6 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-lg font-bold">✕</button>
            <div id="modal-content">
                <!-- Stock full details will load here -->
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBr0I4BZvv4651iJ1qYd71ujgzqJHIEscQ",
            authDomain: "karigarhub-4be11.firebaseapp.com",
            projectId: "karigarhub-4be11",
            storageBucket: "karigarhub-4be11.firebasestorage.app",
            messagingSenderId: "53132885049",
            appId: "1:53132885049:web:5604f1ae1379334ec2a1e8",
            measurementId: "G-NHGQ9RM5E3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allStocks = [];

        db.collection('daily_picks').doc('latest_scan').get().then((doc) => {
            if (doc.exists) {
                const data = doc.data();
                allStocks = data.stocks || [];
                document.getElementById('last-updated').innerText = `Synced: Today (${allStocks.length} Stocks)`;
                
                generateCategoryBoxes(allStocks);
                renderStocks(allStocks);
            } else {
                document.getElementById('stocks-container').innerHTML = '<p class="text-center text-red-500 py-10">No data found in Firebase!</p>';
            }
        }).catch(err => {
            console.error(err);
            document.getElementById('stocks-container').innerHTML = '<p class="text-center text-red-500 py-10">Failed to load terminal data.</p>';
        });

        // Dynamic Category Boxes Generator
        function generateCategoryBoxes(stocks) {
            const categories = [...new Set(stocks.map(s => s.category))];
            const boxContainer = document.getElementById('category-boxes');
            boxContainer.innerHTML = '';

            // 'All' ka default box
            boxContainer.innerHTML += `
                <div onclick="filterByCategory('All')" class="bg-gray-900 border border-gray-800 p-3 rounded-xl cursor-pointer hover:border-blue-500 transition shadow-lg">
                    <p class="text-xs text-blue-400 font-bold">⭐ MASTER TERMINAL</p>
                    <p class="text-xs font-semibold text-white mt-1">All Stocks (${stocks.length})</p>
                </div>
            `;

            categories.forEach(cat => {
                const count = stocks.filter(s => s.category === cat).length;
                boxContainer.innerHTML += `
                    <div onclick="filterByCategory('${cat}')" class="bg-gray-900 border border-gray-800 p-3 rounded-xl cursor-pointer hover:border-blue-500 transition shadow-lg">
                        <p class="text-xs text-green-400 font-bold">⚡ ACTIVE PICK</p>
                        <p class="text-xs font-semibold text-white mt-1">${cat} (${count})</p>
                    </div>
                `;
            });
        }

        function filterByCategory(category) {
            if (category === 'All') {
                renderStocks(allStocks);
            } else {
                const filtered = allStocks.filter(s => s.category === category);
                renderStocks(filtered);
            }
        }

        function renderStocks(stocks) {
            const container = document.getElementById('stocks-container');
            container.innerHTML = '';

            if (stocks.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-10">No stocks found.</p>';
                return;
            }

            stocks.forEach((stock, index) => {
                const isPositive = stock.change_val >= 0;
                const card = `
                    <div onclick="openStockDetails(${index})" class="bg-gray-900 border border-gray-800 hover:border-blue-500/50 p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-3 transition cursor-pointer">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="font-bold text-sm text-white">${stock.symbol}</h3>
                                <span class="text-xs bg-blue-950 text-blue-400 px-2 py-0.5 rounded border border-blue-900">${stock.category}</span>
                                <span class="text-xs bg-purple-950 text-purple-300 px-2 py-0.5 rounded border border-purple-900">Score: ${stock.smart_score}</span>
                            </div>
                            <p class="text-xs text-gray-400 mt-1">${stock.name}</p>
                            <div class="flex flex-wrap gap-2 mt-2 text-xs text-gray-300">
                                <span class="bg-gray-800 px-2 py-0.5 rounded">📦 ${stock.consolidation_range}</span>
                                <span class="bg-gray-800 px-2 py-0.5 rounded">⚡ ${stock.volume_spike}</span>
                                <span class="text-gray-400">💡 ${stock.why_selected}</span>
                            </div>
                        </div>
                        <div class="text-left md:text-right w-full md:w-auto flex md:flex-col justify-between items-center md:items-end border-t md:border-t-0 pt-2 md:pt-0 border-gray-800">
                            <span class="font-mono text-sm font-bold text-white">${stock.price}</span>
                            <span class="font-mono text-xs font-semibold ${isPositive ? 'text-green-400' : 'text-red-400'}">${stock.change}</span>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // Open Full Details Popup when stock is clicked/touched
        function openStockDetails(index) {
            const stock = allStocks[index];
            const isPositive = stock.change_val >= 0;
            const modalContent = document.getElementById('modal-content');
            
            modalContent.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 class="text-lg font-bold text-white">${stock.symbol}</h2>
                        <p class="text-xs text-gray-400">${stock.name}</p>
                    </div>
                    <div class="text-right">
                        <span class="text-base font-mono font-bold text-white">${stock.price}</span>
                        <p class="text-xs font-semibold ${isPositive ? 'text-green-400' : 'text-red-400'}">${stock.change}</p>
                    </div>
                </div>
                <div class="space-y-3 text-xs text-gray-300 bg-gray-950 p-4 rounded-xl border border-gray-800">
                    <div class="flex justify-between border-b border-gray-800 pb-2">
                        <span class="text-gray-400">Category:</span>
                        <span class="font-bold text-blue-400">${stock.category}</span>
                    </div>
                    <div class="flex justify-between border-b border-gray-800 pb-2">
                        <span class="text-gray-400">Smart Score:</span>
                        <span class="font-bold text-purple-400">${stock.smart_score} / 100</span>
                    </div>
                    <div class="flex justify-between border-b border-gray-800 pb-2">
                        <span class="text-gray-400">Volume Spike:</span>
                        <span class="font-bold text-white">${stock.volume_spike}</span>
                    </div>
                    <div class="flex justify-between border-b border-gray-800 pb-2">
                        <span class="text-gray-400">Consolidation Range:</span>
                        <span class="font-bold text-white">${stock.consolidation_range}</span>
                    </div>
                    <div>
                        <span class="text-gray-400 block mb-1">Scanner Reason / Trigger:</span>
                        <p class="text-green-400 font-medium bg-gray-900 p-2 rounded border border-gray-800">${stock.why_selected}</p>
                    </div>
                </div>
            `;
            document.getElementById('stock-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('stock-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
